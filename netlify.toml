[build]
  publish = "."

# Los scripts cambian con cada fecha nueva: que el navegador siempre revalide.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

# La carpeta publicada es la raíz del repo: que los documentos de trabajo y las pruebas no se sirvan.
[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true
